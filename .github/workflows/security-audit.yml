# Dependency vulnerability scanning for api/ and web/, run as its own workflow
# so it does not disturb ci.yml's job list or gate (owned by other workstreams
# rebuilding those trees). Triggers match ci.yml (pull_request + push to main)
# so a Dependabot PR gets scanned the same as a human one.
#
# Neither tool is added as a project dependency (AGENTS.md: ask first for new
# Poetry/npm dependencies). pip-audit is pip-installed into the job's Poetry
# venv, which is thrown away with the runner; `npm audit` ships inside npm
# itself, so no install is needed at all.
name: security-audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      - name: Install dependencies
        # A real install (not just a lock-file scan) so pip-audit can also see
        # any vulnerability that only shows up in a transitively resolved
        # version, not just what poetry.lock names.
        run: poetry install --no-interaction --extras dev

      - name: Audit installed packages
        # pip-audit audits the environment it runs in, so it is installed into
        # the Poetry venv for this job only (pip-audit has no flag to point it
        # at another interpreter). pip is upgraded first: the venv's bundled
        # pip is old and never ships in the image. `--skip-editable` skips the
        # app itself, which is not on PyPI.
        #
        # PYSEC-2026-1845 (pytest < 9.0.3) is ignored: pytest is a dev extra the
        # image never installs (`poetry install --only main`), and pytest 9 also
        # needs pytest-asyncio 1.x. Drop the ignore when both are upgraded.
        run: |
          poetry run pip install --quiet --upgrade pip pip-audit
          poetry run pip-audit --skip-editable --ignore-vuln PYSEC-2026-1845

  npm-audit:
    name: npm-audit (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check web/ exists
        # web/ is being built by a parallel workstream and may not have
        # landed on this branch yet. Skip cleanly rather than failing a job
        # for a directory nobody has created yet.
        id: web-check
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/package.json not found yet; skipping npm audit until web/ lands."
          fi

      - name: Setup Node
        if: steps.web-check.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.web-check.outputs.present == 'true'
        working-directory: web
        run: npm ci

      - name: Audit dependencies (high and critical only)
        # `--audit-level=high` matches the bar this repo cares about in CI, and
        # `--omit=dev` audits only what ships: the lint plugins
        # (eslint-config-next, eslint-plugin-boundaries) carry advisories whose
        # only "fix" is a downgrade, and they never run on the site.
        if: steps.web-check.outputs.present == 'true'
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
