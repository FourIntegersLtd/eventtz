# Dependency vulnerability scanning for api/ and web/: `pip-audit` and `npm audit`.
# Runs when a manifest or lockfile changes, plus weekly for advisories published
# against dependencies that did not change. Neither tool is a project dependency:
# pip-audit is pip-installed into the job's throwaway venv and `npm audit` ships with npm.
name: security-audit

on:
  pull_request:
    paths:
      - "api/pyproject.toml"
      - "api/poetry.lock"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/security-audit.yml"
  push:
    branches:
      - main
    paths:
      - "api/pyproject.toml"
      - "api/poetry.lock"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      - name: Install dependencies
        # A real install (not just a lock-file scan) so pip-audit can also see
        # any vulnerability that only shows up in a transitively resolved
        # version, not just what poetry.lock names.
        run: poetry install --no-interaction --extras dev

      - name: Audit installed packages
        # pip-audit audits the environment it runs in, so it is installed into
        # the Poetry venv for this job only (pip-audit has no flag to point it
        # at another interpreter). pip is upgraded first: the venv's bundled
        # pip is old and never ships in the image. `--skip-editable` skips the
        # app itself, which is not on PyPI.
        #
        # PYSEC-2026-1845 (pytest < 9.0.3) is ignored: pytest is a dev extra the
        # image never installs (`poetry install --only main`), and pytest 9 also
        # needs pytest-asyncio 1.x. Drop the ignore when both are upgraded.
        run: |
          poetry run pip install --quiet --upgrade pip pip-audit
          poetry run pip-audit --skip-editable --ignore-vuln PYSEC-2026-1845

  npm-audit:
    name: npm-audit (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Audit dependencies (high and critical only)
        # `--audit-level=high` matches the bar this repo cares about in CI, and
        # `--omit=dev` audits only what ships: the lint plugins
        # (eslint-config-next, eslint-plugin-boundaries) carry advisories whose
        # only "fix" is a downgrade, and they never run on the site.
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
