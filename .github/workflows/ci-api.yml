# api/ CI: lint, types, architecture guards and tests over Postgres. Runs only
# when api/ changes, to save the account's shared Actions minutes.
name: ci-api

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventtz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventtz_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventtz_test
      REDIS_DISABLED: "1"
      APP_ENV: test
      SENTRY_DSN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api/.venv
          key: venv-api-${{ runner.os }}-py3.13-${{ hashFiles('api/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --extras dev --no-root

      - name: Migrate database
        run: poetry run alembic upgrade head

      - name: Lint, typecheck, architecture and tests
        run: make ci
