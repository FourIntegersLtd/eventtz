# Static analysis (CodeQL) for both languages in this repo: Python (api/,
# backend/ as reference-only source, scanned read-only like any other code)
# and JavaScript/TypeScript (web/, frontend/). Runs on every PR, on push to
# main, and weekly so a newly-published query still catches something already
# merged.
name: codeql

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Mondays at 06:00 UTC, ahead of the Dependabot run later the same day.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # CodeQL needs to write its findings to the repo's Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Build-mode "none": CodeQL scans the source directly rather than
          # compiling. Neither language here needs a compiled artefact for
          # analysis (Python is interpreted; the JS/TS analysis reads source).
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
