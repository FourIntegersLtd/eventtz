# web/ CI: types, tests and build. Runs only when web/ changes, to save the
# account's shared Actions minutes (all private repos draw on one allowance).
name: ci-web

on:
  pull_request:
    paths:
      - "web/**"
      - "api/openapi.json"
      - ".github/workflows/ci-web.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "api/openapi.json"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: API types are current
        run: npm run api:types:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
