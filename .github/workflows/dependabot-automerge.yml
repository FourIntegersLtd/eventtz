# Auto-merge for Dependabot patch/minor PRs, once (and only once) CI is green.
#
# `ci.yml` already triggers on `pull_request` (untouched by this file), so a
# Dependabot PR gets the same CI run as a human PR before this workflow ever
# looks at it. Until `ci.yml` also tests `api/` and `web/`, that run covers only
# the baseline: see docs/runbooks/github-security-settings.md before enabling this. This workflow does not run tests
# itself; it only reads the PR's dependency-update metadata and, for
# patch/minor bumps, tells GitHub to merge the PR automatically the moment its
# other required checks (CI) pass. A major-version bump is left alone for a
# human to review.
#
# Runs on `pull_request_target` (not `pull_request`) so the workflow has
# `contents: write`/`pull-requests: write` from the base repo's token even
# though Dependabot's PR is technically a "fork-like" actor; it does not check
# out or execute the PR's own code, so this is the standard safe pattern for
# bot-authored PRs.
name: dependabot-automerge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only PRs Dependabot opened, in this repository, are eligible. The check is on
    # the PR's author, not `github.actor`: the actor is whoever triggered this run,
    # so Dependabot rebasing a PR someone else had pushed commits to would pass an
    # actor check while merging code Dependabot never wrote.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'FourIntegersLtd/eventtz'
    steps:
      - name: Read the dependency update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch and minor updates
        # `gh pr merge --auto` does not merge immediately: it tells GitHub to
        # merge once every required status check (including CI, per branch
        # protection) reports success. A major bump is left for a human to
        # merge by hand after reading the changelog.
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: "${{ github.event.pull_request.html_url }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh pr merge --auto --squash "$PR_URL"
