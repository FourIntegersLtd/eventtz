# Dependabot: automated dependency update PRs for the rebuild stack only.
#
# `acceptance/` has no manifest of its own: its tests run under `api/`'s Poetry
# environment (see `acceptance/Makefile`), so there is nothing separate for
# Dependabot to version there — bumping `api/`'s `pip` entry below covers it.
#
# Each ecosystem groups patch and minor bumps into one weekly PR, so there is
# one PR per ecosystem to review. Every PR is merged by hand: `ci.yml` does not
# test `api/` or `web/` yet, and a private repo on the free plan has no branch
# protection to hold an auto-merge back until checks pass (see
# docs/runbooks/github-security-settings.md). Major bumps are left ungrouped —
# they need a human to read the changelog, since a major version can change
# behaviour CI won't catch (e.g. a Stripe SDK major version changing a response
# shape).
version: 2
updates:
  # api/: FastAPI + SQLAlchemy on Poetry. Dependabot's "pip" ecosystem reads
  # pyproject.toml/poetry.lock natively for Poetry projects.
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "api"
    groups:
      api-patch-minor:
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "api"

  # web/: Next.js + npm.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    groups:
      web-patch-minor:
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "web"

  # The workflow files themselves (actions pinned to a SHA still get patch/minor
  # tag-following bumps proposed here; the SHA pin keeps a compromised tag from
  # silently changing what runs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "ci"
