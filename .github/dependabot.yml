# Dependabot: automated dependency update PRs for the rebuild stack only.
#
# `acceptance/` has no manifest of its own: its tests run under `api/`'s Poetry
# environment (see `acceptance/Makefile`), so there is nothing separate for
# Dependabot to version there — bumping `api/`'s `pip` entry below covers it.
#
# At most two PRs per ecosystem: one for all patch/minor bumps and one for all
# major bumps, so CI runs a few times a month instead of once per package (all
# private repos on the account share one Actions allowance). GitHub Actions bumps
# come monthly in a single PR. Every PR is merged by hand: a private repo on the free plan has no branch
# protection to hold an auto-merge back until checks pass (see
# docs/runbooks/github-security-settings.md). Major bumps need a human to read the changelog, since a major version can change
# behaviour CI won't catch (e.g. a Stripe SDK major version changing a response
# shape).
version: 2
updates:
  # api/: FastAPI + SQLAlchemy on Poetry. Dependabot's "pip" ecosystem reads
  # pyproject.toml/poetry.lock natively for Poetry projects.
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "api"
    groups:
      api-patch-minor:
        update-types:
          - "patch"
          - "minor"
      api-major:
        update-types:
          - "major"
    commit-message:
      prefix: "api"

  # web/: Next.js + npm.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "web"
    groups:
      web-patch-minor:
        update-types:
          - "patch"
          - "minor"
      web-major:
        update-types:
          - "major"
    commit-message:
      prefix: "web"

  # The workflow files themselves (actions pinned to a SHA still get patch/minor
  # tag-following bumps proposed here; the SHA pin keeps a compromised tag from
  # silently changing what runs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
