[project]
name = "eventtz-api"
version = "0.1.0"
description = "Eventtz API"
authors = [{ name = "Eventtz Ltd", email = "hello@eventtz.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "python-multipart (>=0.0.31,<0.0.32)",
    "sentry-sdk (>=2.72.0,<3.0.0)",
    "openai (>=2.29.0,<3.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "boto3 (>=1.43.114,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.0.55,<2.1)",
    "psycopg[binary,pool] (>=3.2,<4)",
    "alembic (>=1.14,<2)",
    "procrastinate (>=3.0,<4)",
    "pyjwt (>=2.15.1,<3)",
    "argon2-cffi (>=23.1,<26)",
    "bcrypt (>=4.2,<6)",  # imported Supabase hashes only; removed once they are all rehashed (ADR 0003)
    "structlog (>=24.4,<26)",
    "redis (>=5.2,<6)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.24.0,<1.0.0)",
    "ruff (>=0.17.0,<1.0.0)",
    "mypy (>=1.11.0,<2.0.0)",
    "import-linter (>=2.0,<3.0)",
    "boto3-stubs[s3] (>=1.43.114,<2.0.0)",
    "testcontainers[postgres] (>=4.8,<5)",
]

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the engine and the migrated database are
# session fixtures, and an asyncpg/psycopg pool cannot cross loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "db: needs the migrated Postgres (skipped with a message when Docker is unavailable)",
    "e2e: drives the whole app over HTTP",
    "redis: needs a reachable Redis (skipped with a message when one is not configured)",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["."]
# Generated revisions are reviewed by hand, not reformatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "SIM"]
ignore = ["S101", "N818"]  # assert is fine in tests; error classes read at the raise site

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # literal test secrets
"../acceptance/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Architecture: `core` is the shared kernel and never knows about a feature.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core never imports features or adapters"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.features", "app.adapters"]
