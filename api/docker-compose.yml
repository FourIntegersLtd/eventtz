name: eventtz-api

# Local services for api/ (`make db-up`). Copied from OSCE platform-api, on
# different host ports so both projects can run at once (OSCE uses 5433/6380).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventtz
    ports:
      - "5434:5432"
    volumes:
      - eventtz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

volumes:
  eventtz_pg:
