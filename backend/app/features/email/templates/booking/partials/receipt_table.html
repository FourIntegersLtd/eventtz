<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="100%"
  style="width: 100%; margin: 16px 0; border-collapse: collapse"
>
  <tr>
    <th
      align="left"
      style="
        padding: 10px 0;
        border-bottom: 1px solid #e8e4ef;
        color: #6b6575;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      "
    >
      Description
    </th>
    <th
      align="right"
      style="
        padding: 10px 0;
        border-bottom: 1px solid #e8e4ef;
        color: #6b6575;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      "
    >
      Amount
    </th>
  </tr>
  {% for line in receipt.line_items %}
  <tr>
    <td style="padding: 10px 0; border-bottom: 1px solid #f3f0f8; color: #2d2938; font-size: 14px">
      {{ line.label }}
    </td>
    <td
      align="right"
      style="
        padding: 10px 0;
        border-bottom: 1px solid #f3f0f8;
        color: #2d2938;
        font-size: 14px;
        white-space: nowrap;
      "
    >
      {{ line.amount_label }}
    </td>
  </tr>
  {% endfor %}
  <tr>
    <td style="padding: 14px 0 0; color: #3e1964; font-size: 15px; font-weight: 700">Total</td>
    <td
      align="right"
      style="padding: 14px 0 0; color: #3e1964; font-size: 15px; font-weight: 700; white-space: nowrap"
    >
      {{ receipt.total_label }}
    </td>
  </tr>
</table>
